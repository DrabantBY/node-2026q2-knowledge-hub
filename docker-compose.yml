services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-hub-api:latest
    container_name: knowledge-hub-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - knowledge-hub-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  adminer:
    image: adminer:latest
    container_name: knowledge-hub-adminer
    ports:
      - "8080:8080"
    networks:
      - knowledge-hub-network
    depends_on:
      - db
    profiles:
      - debug

networks:
  knowledge-hub-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
